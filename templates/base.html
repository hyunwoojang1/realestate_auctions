<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}아파트 경매 1차 필터{% endblock %}</title>
{# Pretendard 웹폰트(동적 서브셋) — Windows 맑은고딕 폴백 탈출. 토스/아실 계열 렌더링의 절반은 이 폰트다. #}
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ============================================================
   Data-Thin (아실 스타일) — 화이트 + 1px 헤어라인 + 컴팩트 데이터 밀도.
   원칙: 박스 대신 구분선, 큰 카드 대신 얇은 밴드, 의미 있는 곳에만 색.
   (2026-07-03 리디자인 — 이전 Warm-Paper Broadsheet 폐기)
   ============================================================ */
:root{
  /* 레이어드 중립 — 회색 캔버스(--paper) 위에 흰 서피스(--surface)를 얹는다(토스/아실 구조).
     ui-ux-pro-max 추천: Data-Dense Dashboard 스타일 × Banking/Traditional Finance 팔레트 */
  --paper:#f4f6f9; --surface:#ffffff; --surface-2:#f1f4f8; --wheat:#e9eef4;
  --ink:#111827; --ink-strong:#0b1220; --muted:#5b6472; --muted-2:#98a1ad;
  --hairline:#e9edf2; --hairline-strong:#dbe1e9; --border-field:#c6cfda;
  /* 상호작용(블루) */
  --accent:#2563eb; --accent-hover:#1d4fc4; --accent-tint:#eaf1fe; --focus-ring:rgba(37,99,235,.4);
  /* 신호색 */
  --pos:#16a34a; --pos-strong:#12813c; --pos-tint:#e4f5ea;
  --risk:#dc2626; --risk-strong:#b91c1c; --risk-tint:#fbe9e9;
  --warn:#d97706; --warn-tint:#fbf1de;
  --unv:#7048e8; --unv-tint:#f0ebfd;               /* 권리미확인 — 보라(경고와 구분) */
  --conf-high:#0c8599; --conf-mid:#d97706; --conf-low:#98a1ad;
  --score-90:#12813c; --score-75:#2e9e5b; --score-60:#d97706; --score-lt60:#98a1ad;
  --shadow-card:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
  /* 타입 스케일(컴팩트) */
  --t-score-hero:2.6rem; --t-score:1.5rem; --t-price:1.25rem; --t-h1:1.35rem;
  --t-h2:1.05rem; --t-body:.875rem; --t-data:.8125rem; --t-label:.71875rem; --t-note:.6875rem;
  --ls-head:-.015em; --ls-label:.04em;
  /* 간격/모양(타이트) */
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:28px;--sp-7:40px;
  --r-ctl:6px; --r-card:8px; --r-pill:9999px;
  --shadow-sm:0 1px 2px rgba(13,17,23,.05); --shadow-hover:0 4px 14px rgba(13,17,23,.08);
  --row-h:40px; --cell-px:12px;
  --font-ui:"Pretendard Variable","Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  /* 세리프 폐기 — 숫자도 동일 산세리프(아실/토스 계열 데이터 타이포) */
  --font-serif:"Pretendard Variable","Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"SFMono-Regular",ui-monospace,Consolas,"IBM Plex Mono",monospace;
  --maxw:1200px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-ui);
  font-size:var(--t-body);line-height:1.45;font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px;border-radius:3px}
.num,.mono{font-variant-numeric:tabular-nums slashed-zero}
.mono{font-family:var(--font-mono)}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 clamp(16px,4vw,32px)}

/* ---- 사이트 헤더/네비(슬림) ---- */
.site{border-bottom:1px solid var(--hairline-strong);background:#fff;position:sticky;top:0;z-index:20}
.site .wrap{display:flex;align-items:center;gap:var(--sp-5);height:48px}
.brand{font-weight:800;letter-spacing:var(--ls-head);font-size:.95rem;color:var(--ink-strong)}
.brand b{color:var(--accent)}
.nav{display:flex;gap:2px;margin-left:auto;font-size:var(--t-data);font-weight:600;align-items:center}
.nav a{color:var(--muted);padding:5px 10px;border-radius:var(--r-ctl)}
.nav a:hover{color:var(--ink);background:var(--surface-2);text-decoration:none}
.src{font-size:var(--t-note);font-weight:700;padding:3px 9px;border-radius:var(--r-pill);
  display:inline-flex;align-items:center;gap:5px;letter-spacing:.02em}
.src.live{background:var(--pos-tint);color:var(--pos-strong)}
.src.sample{background:var(--warn-tint);color:var(--warn)}
.src::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

/* ---- 페이지 헤딩(타이트) ---- */
main{padding:clamp(16px,2.5vw,28px) 0 56px}
.page-h{margin:0 0 var(--sp-1);font-size:var(--t-h1);letter-spacing:var(--ls-head);
  color:var(--ink-strong);font-weight:800}
.page-sub{color:var(--muted);font-size:var(--t-data);margin:0;max-width:72ch;line-height:1.55}
h2{font-size:var(--t-h2);letter-spacing:var(--ls-head);margin:var(--sp-6) 0 var(--sp-3)}
.label{font-size:var(--t-label);letter-spacing:var(--ls-label);
  color:var(--muted);font-weight:700}

/* ---- 인사이트 = KPI 카드 행(회색 캔버스 위 흰 카드 — 레이어링) ---- */
.insight{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin:var(--sp-4) 0 var(--sp-4)}
.insight>span{display:flex;flex-direction:column;gap:2px;min-width:120px;
  background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-card);
  box-shadow:var(--shadow-card);padding:10px 14px}
.insight .k{font-size:var(--t-note);letter-spacing:var(--ls-label);color:var(--muted-2);font-weight:600}
.insight .v{font-weight:800;color:var(--ink-strong);font-size:1.05rem} .insight .v.pos{color:var(--pos-strong)}
.insight.flat{}

/* ---- 뱃지(경고 전용 — 색상 분리로 종류 즉시 구분) ---- */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:var(--t-note);font-weight:700;
  padding:2px 8px;border-radius:4px;white-space:nowrap;letter-spacing:.01em}
.b-risk{background:var(--risk-tint);color:var(--risk-strong)}
.b-unknown{background:var(--unv-tint);color:var(--unv)}                                      /* 권리미확인: 보라 */
.b-none{background:var(--surface-2);color:var(--muted);border:1px solid var(--hairline-strong)}   /* 차익없음 */
.b-na{background:transparent;color:var(--muted-2);border:1px dashed var(--hairline-strong)}   /* 시세추정불가: 점선(정보부족) */

/* 권리미확인(rights_verified=False) — 갭/차익의 초록 신호를 중립(muted)으로 강등.
   경고 뱃지만 중립인데 주변이 초록으로 '매수'처럼 보이는 것을 막는다(안전 원칙 일관). */
.hero.unv .hero-score .n{color:var(--muted) !important}
/* 권리미확인 강등: 초록(안전신호)만 금지 — 회색 벽돌이 아니라 중립 블루로(미터가 죽지 않게) */
.unv .gm-gap{background:#d7e4f7 !important}
.unv .gm-gv,.unv .gapline .amt{color:var(--muted) !important}

/* ---- 신뢰도 칩 — 모든 행에 반복되는 요소라 색 예산 쓰지 않음(조용한 아웃라인) ---- */
.conf{display:inline-flex;align-items:center;gap:5px;font-size:var(--t-note);font-weight:600;
  padding:1px 8px;border-radius:var(--r-pill);color:var(--muted);
  background:transparent;border:1px solid var(--hairline-strong)}
.conf.mid{color:var(--conf-mid)}
.conf.low{color:var(--muted-2);border-style:dashed}

/* ---- gap 표시(비교가 메시지) ---- */
.gapline{display:inline-flex;align-items:baseline;gap:6px;font-weight:800}
.gapline .amt{color:var(--pos-strong)} .gapline.neg .amt{color:var(--risk-strong)}
.gapline .arrow{font-size:.85em}
.gapmeter{min-width:150px}
.gm-track{position:relative;height:10px;border-radius:var(--r-pill);background:var(--wheat);overflow:hidden}
.gm-min{position:absolute;left:0;top:0;height:100%;background:#B0A497;background:color-mix(in oklab,var(--ink) 30%,var(--wheat))}
.gm-gap{position:absolute;top:0;height:100%;background:var(--pos-tint)}
.gm-over{position:absolute;top:0;height:100%;background:var(--risk-tint)}   /* 시세 초과(손실) 구간 */
.gm-loss{color:var(--risk-strong);font-weight:800}
.gm-appr{position:absolute;top:-2px;width:2px;height:20px;background:var(--ink);opacity:.4}
.gm-lab{display:flex;justify-content:space-between;gap:8px;font-size:var(--t-note);color:var(--muted);margin-top:5px}
.gm-lab .pos,.gm-gv{color:var(--pos-strong);font-weight:800}
.gm-na,.gm-na2{color:var(--muted-2);font-weight:700}

/* ---- #1 히어로 — 흰 카드 + 블루 좌측 룰(캔버스 위 강조 레이어) ---- */
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:var(--sp-5);align-items:center;
  background:var(--surface);border:1px solid var(--hairline);border-left:3px solid var(--accent);
  border-radius:var(--r-card);box-shadow:var(--shadow-card);
  padding:var(--sp-3) var(--sp-5) var(--sp-3);
  margin-bottom:var(--sp-4);position:relative;overflow:hidden}
/* (T8 감사 수정) 캡션은 마크업(.hero-caption)으로 — 목록 히어로 전용. */
.hero-caption{position:absolute;top:8px;left:var(--sp-5);
  font-size:var(--t-note);font-weight:700;letter-spacing:var(--ls-label);color:var(--accent)}
.hero-score{text-align:left;padding-top:16px}
.hero-score .n{font-size:1.7rem;line-height:1;font-weight:800;color:var(--ink-strong)}
.hero-mid{padding-top:16px}
.hero-mid .name{font-size:1rem;font-weight:800;letter-spacing:var(--ls-head)}
.hero-mid .addr{color:var(--muted);font-size:var(--t-note);margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero-why{text-align:right;padding-top:16px;max-width:260px}
.hero-why .go{display:inline-block;margin-top:6px;font-weight:700;font-size:var(--t-data)}
@media(max-width:720px){
  .hero{grid-template-columns:1fr;text-align:left}
  .hero-why{text-align:left;max-width:none}
  .hero-score{text-align:left}
  .hero-mid>div{max-width:100% !important}
}
/* 모바일(폰) — 필터/카드/히어로 재배치 + 44px 터치타깃 */
@media(max-width:560px){
  :root{--cell-px:10px}
  .site .wrap{gap:var(--sp-3)}
  .nav{gap:var(--sp-3)}
  .filters{flex-direction:column;align-items:stretch;gap:var(--sp-2)}
  .filters input,.filters select{width:100%}
  .filters button{width:100%;padding:12px}
  .filters .reset{text-align:center;padding:10px}
  .insight{gap:var(--sp-2) var(--sp-4);padding:var(--sp-3) var(--sp-4)}
  .gm-lab{flex-wrap:wrap}
  .hero{padding:var(--sp-3)}
  .hero-score .n{font-size:1.6rem}
  .cards{grid-template-columns:1fr}
  .nav a,.back,.reset,.hero-why .go{display:inline-block;padding:5px 2px}
}

/* ---- 랭킹 테이블 — 흰 카드 컨테이너 + 밀도 높은 행(아실식) ---- */
.tablewrap{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-card);
  box-shadow:var(--shadow-card);overflow:hidden}
.scrollx{overflow-x:auto}
table.picks{border-collapse:collapse;width:100%;min-width:820px}
.picks th,.picks td{padding:0 var(--cell-px);height:var(--row-h);text-align:left;vertical-align:middle;
  border-bottom:1px solid var(--hairline)}
.picks thead th{position:sticky;top:0;background:var(--surface-2);z-index:1;height:34px;
  font-size:var(--t-note);letter-spacing:var(--ls-label);color:var(--muted);
  font-weight:700;border-bottom:1px solid var(--hairline-strong)}
.picks tbody tr:last-child td{border-bottom:none}
.picks tbody tr:hover{background:var(--accent-tint)}
.picks tbody tr.hot td:first-child{box-shadow:inset 3px 0 0 var(--pos)}
.picks tbody tr.dim,.params tbody tr.dim{color:var(--muted)}
.picks td.r,.picks th.r{text-align:right}
.picks td.num{font-variant-numeric:tabular-nums}
.picks .rank{color:var(--muted-2);font-size:var(--t-note);width:26px}
.picks .name{font-weight:700;color:var(--ink-strong)}
.picks .addr{color:var(--muted);font-size:var(--t-note);font-weight:400;margin-top:1px;
  max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picks .caseid{font-family:var(--font-mono);font-size:var(--t-note);color:var(--muted-2)}
.picks .scorecell{width:96px}
.money{font-weight:700}.money .u{color:var(--muted-2);font-weight:500;font-size:.85em;margin-left:1px}

/* ---- 필터(흰 카드 바) ---- */
.filters{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:flex-end;margin:var(--sp-3) 0 var(--sp-4);
  background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-card);
  box-shadow:var(--shadow-card);padding:10px 14px}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:var(--t-note);color:var(--muted-2);
  font-weight:600;letter-spacing:var(--ls-label)}
.filters input,.filters select{font:inherit;font-size:var(--t-data);padding:5px 8px;border:1px solid var(--border-field);
  border-radius:var(--r-ctl);background:#fff;color:var(--ink);height:30px}
.filters input{width:88px}
.filters button{font:inherit;font-size:var(--t-data);font-weight:700;padding:0 14px;height:30px;border:none;
  border-radius:var(--r-ctl);background:var(--accent);color:#fff;cursor:pointer}
.filters button:hover{background:var(--accent-hover)}
.filters .reset{font-size:var(--t-note);color:var(--muted);padding:6px 4px}

/* ---- 섹션 카드(상세) — 회색 캔버스 위 흰 카드 레이어 ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--sp-3);margin-top:var(--sp-4)}
.card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-card);
  box-shadow:var(--shadow-card);padding:var(--sp-4) var(--sp-5)}
.card h2{font-size:var(--t-label);letter-spacing:var(--ls-label);color:var(--muted);margin:0 0 var(--sp-2);font-weight:700;
  text-transform:none;border-bottom:1px solid var(--hairline);padding-bottom:8px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--hairline);font-size:var(--t-data)}
.kv:last-child{border-bottom:none}.kv .k{color:var(--muted)}
.kv .v{font-weight:700;font-variant-numeric:tabular-nums}
.kv .v.neg{color:var(--risk-strong)}

/* ---- 상태 콜아웃(박스 대신 얇은 좌측 룰) ---- */
.note-box{border-radius:0;padding:8px 12px;font-size:var(--t-note);font-weight:500;margin-bottom:var(--sp-2);
  line-height:1.55;border-left:3px solid;background:var(--surface-2);color:var(--ink)}
.n-risk{border-left-color:var(--risk);background:var(--risk-tint);color:var(--risk-strong)}
.n-warn{border-left-color:var(--warn);background:var(--warn-tint);color:#7c4a08}
.n-ok{border-left-color:var(--pos);background:var(--pos-tint);color:var(--pos-strong)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:var(--t-note);font-weight:700;padding:3px 9px;border-radius:var(--r-pill);background:var(--surface-2);color:var(--muted)}
.tag.warn{background:var(--risk-tint);color:var(--risk-strong)}

/* ---- 방법론 ---- */
.formula{background:var(--surface-2);border-left:3px solid var(--accent);border-radius:0;
  padding:12px 16px;font-family:var(--font-mono);font-size:var(--t-data);line-height:1.9}
.formula .w1{color:var(--pos-strong);font-weight:700}
.formula .w2{color:var(--accent);font-weight:700}
.formula .w3{color:var(--warn);font-weight:700}
table.params{border-collapse:collapse;width:100%;font-size:var(--t-data);background:var(--surface);
  border:1px solid var(--hairline);border-radius:var(--r-card);overflow:hidden;box-shadow:var(--shadow-card)}
.params th,.params td{padding:7px 10px;border-bottom:1px solid var(--hairline);text-align:left}
.params tbody tr:last-child td{border-bottom:none}
.params thead th{background:var(--surface-2);font-size:var(--t-note);letter-spacing:var(--ls-label);color:var(--muted);border-bottom:1px solid var(--hairline-strong)}
.params tbody tr:hover{background:var(--accent-tint)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chips .chip{background:var(--surface-2);border:1px solid var(--hairline);border-radius:var(--r-ctl);padding:6px 12px;font-size:var(--t-data)}
.chips .chip b{color:var(--accent);font-family:var(--font-mono)}

/* ---- 탭 바(상세 — 스택 대신 관심사 전환) ---- */
.tabbar{display:flex;gap:0;border-bottom:1px solid var(--hairline-strong);margin-top:var(--sp-5)}
.tabbar button{font:inherit;font-size:var(--t-data);font-weight:700;color:var(--muted);
  background:none;border:none;border-bottom:2px solid transparent;padding:8px 14px;cursor:pointer;margin-bottom:-1px}
.tabbar button:hover{color:var(--ink)}
.tabbar button.on{color:var(--accent);border-bottom-color:var(--accent)}

/* ---- 푸터 ---- */
.foot{margin-top:var(--sp-6);color:var(--muted-2);font-size:var(--t-note);line-height:1.7;
  border-top:1px solid var(--hairline);padding-top:var(--sp-3)}
.back{color:var(--muted);font-size:var(--t-data)}.back:hover{color:var(--accent)}
</style>
{% block head %}{% endblock %}
</head>
<body>
<header class="site">
  <div class="wrap">
    <span class="brand">아파트 경매 <b>1차 필터</b></span>
    <nav class="nav">
      <a href="/">매물</a>
      <a href="/map">지도</a>
      <a href="/calendar">일정</a>
      <a href="/watchlist">관심</a>
      <a href="/stats">통계</a>
      <a href="/methodology">방법론</a>
      {% if data_source is defined %}
        {% if data_source == 'db' %}<span class="src live">라이브 DB</span>
        {% else %}<span class="src sample">샘플 데이터</span>{% endif %}
      {% endif %}
    </nav>
  </div>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
</body>
</html>
