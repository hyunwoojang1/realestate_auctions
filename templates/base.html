<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}차익 큐레이션{% endblock %}</title>
<style>
/* ============================================================
   Warm-Paper Financial Broadsheet — 조용한 chrome, 큰 숫자.
   토큰 전체는 docs/design-brief.md 참고.
   ============================================================ */
:root{
  /* 중립(웜 페이퍼) */
  --paper:#FFF1E5; --surface:#FFFBF7; --surface-2:#F7E9DB; --wheat:#F2DFCE;
  --ink:#262A33; --ink-strong:#14171C; --muted:#6B7280; --muted-2:#9AA0AB;
  --hairline:#E7D8C9; --hairline-strong:#D8C6B4; --border-field:#CBB9A6;
  /* 상호작용(링크 전용, 차익색과 구분) */
  --accent:#0F5499; --accent-hover:#0C4680; --focus-ring:rgba(15,84,153,.45);
  /* 신호색(색 예산 전부 여기에) */
  --pos:#00994D; --pos-strong:#0A7A3E; --pos-tint:#DDF0E4;
  --risk:#CC0000; --risk-strong:#990F3D; --risk-tint:#FBE3E3;
  --warn:#C4600E; --warn-tint:#FBEBD8;
  --conf-high:#0D7680; --conf-mid:#C4600E; --conf-low:#9AA0AB;
  /* 스코어 크기-색 램프(단일 색상 계열) */
  --score-90:#0A7A3E; --score-75:#2E9E5B; --score-60:#C4600E; --score-lt60:#9AA0AB;
  /* 타입 스케일 */
  --t-score-hero:4rem; --t-score:2rem; --t-price:1.5rem; --t-h1:1.6875rem;
  --t-h2:1.25rem; --t-body:.9375rem; --t-data:.8125rem; --t-label:.75rem; --t-note:.6875rem;
  --ls-head:-.02em; --ls-label:.04em;
  /* 간격/모양 */
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;--sp-7:48px;
  --r-ctl:5px; --r-card:10px; --r-pill:9999px;
  --shadow-sm:0 1px 2px rgba(38,42,51,.06); --shadow-hover:0 6px 20px rgba(38,42,51,.12);
  --row-h:46px; --cell-px:14px;
  --font-ui:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-serif:Georgia,"Times New Roman","Nanum Myeongjo",serif;
  --font-mono:"IBM Plex Mono","SFMono-Regular",ui-monospace,Consolas,monospace;
  --maxw:1120px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-ui);
  font-size:var(--t-body);line-height:1.45;font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px;border-radius:3px}
.num,.mono{font-variant-numeric:tabular-nums slashed-zero}
.mono{font-family:var(--font-mono)}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 clamp(16px,4vw,32px)}

/* ---- 사이트 헤더/네비 ---- */
.site{border-bottom:1px solid var(--hairline);background:color-mix(in oklab,var(--paper) 88%,#fff)}
.site .wrap{display:flex;align-items:center;gap:var(--sp-5);height:60px}
.brand{font-weight:800;letter-spacing:var(--ls-head);font-size:1.05rem;color:var(--ink-strong)}
.brand b{color:var(--pos-strong)}
.nav{display:flex;gap:var(--sp-4);margin-left:auto;font-size:var(--t-data);font-weight:600}
.nav a{color:var(--muted)} .nav a:hover{color:var(--ink)}
.src{font-size:var(--t-note);font-weight:700;padding:3px 9px;border-radius:var(--r-pill);
  display:inline-flex;align-items:center;gap:5px;letter-spacing:.02em}
.src.live{background:var(--pos-tint);color:var(--pos-strong)}
.src.sample{background:var(--warn-tint);color:var(--warn)}
.src::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

/* ---- 페이지 헤딩 ---- */
main{padding:clamp(24px,4vw,44px) 0 64px}
.page-h{margin:0 0 var(--sp-2);font-size:var(--t-h1);letter-spacing:var(--ls-head);
  color:var(--ink-strong);font-weight:800}
.page-sub{color:var(--muted);font-size:var(--t-data);margin:0;max-width:60ch;line-height:1.55}
h2{font-size:var(--t-h2);letter-spacing:var(--ls-head);margin:var(--sp-6) 0 var(--sp-3)}
.label{font-size:var(--t-label);text-transform:uppercase;letter-spacing:var(--ls-label);
  color:var(--muted);font-weight:700}

/* ---- 인사이트 밴드(리스트 상단 한 줄 판정) ---- */
.insight{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--sp-2) var(--sp-5);
  margin:var(--sp-4) 0 var(--sp-5);padding:var(--sp-4) var(--sp-5);
  background:var(--surface);border:1px solid var(--hairline-strong);border-radius:var(--r-card);
  border-left:4px solid var(--pos)}
.insight .k{font-size:var(--t-note);text-transform:uppercase;letter-spacing:var(--ls-label);color:var(--muted);font-weight:700}
.insight .v{font-weight:800;color:var(--ink-strong)} .insight .v.pos{color:var(--pos-strong)}

/* ---- 스코어(숫자 + 크기막대) ---- */
.scoreno{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:700;
  font-size:var(--t-score);line-height:1;letter-spacing:-.02em}
.scoreno.na{color:var(--muted-2);font-size:1.1rem}
.sc-90{color:var(--score-90)} .sc-75{color:var(--score-75)}
.sc-60{color:var(--score-60)} .sc-lt60{color:var(--score-lt60)}
.scorebar{height:5px;border-radius:var(--r-pill);background:var(--wheat);margin-top:5px;overflow:hidden;min-width:52px}
.scorebar>i{display:block;height:100%;border-radius:inherit}
.sc-90~.scorebar>i,.scorebar>i.f-90{background:var(--score-90)}
/* fill color set inline by width; hue by class on the cell */
.scorecell.sc-90 .scorebar>i{background:var(--score-90)}
.scorecell.sc-75 .scorebar>i{background:var(--score-75)}
.scorecell.sc-60 .scorebar>i{background:var(--score-60)}
.scorecell.sc-lt60 .scorebar>i{background:var(--score-lt60)}

/* ---- 뱃지(등급) — 뱃지 단독 금지, 항상 gap과 같은 밴드 ---- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:var(--t-label);font-weight:800;
  padding:3px 10px;border-radius:var(--r-pill);white-space:nowrap;letter-spacing:.01em}
.b-top{background:var(--pos);color:#fff}
.b-good{background:var(--pos-tint);color:var(--pos-strong)}
.b-mid{background:var(--warn-tint);color:var(--warn)}
.b-risk{background:var(--risk-tint);color:var(--risk-strong)}
.b-unknown{background:var(--surface-2);color:var(--muted);border:1px dashed var(--border-field)}
.b-none{background:transparent;color:var(--muted-2);border:1px solid var(--hairline-strong)}

/* ---- 신뢰도 칩(별도의 더 조용한 채널) ---- */
.conf{display:inline-flex;align-items:center;gap:5px;font-size:var(--t-note);font-weight:700;
  padding:2px 8px;border-radius:var(--r-pill);color:var(--conf-high);background:color-mix(in oklab,var(--conf-high) 12%,transparent)}
.conf.mid{color:var(--conf-mid);background:var(--warn-tint)}
.conf.low{color:var(--conf-low);background:var(--surface-2)}

/* ---- gap 표시(비교가 메시지) ---- */
.gapline{display:inline-flex;align-items:baseline;gap:6px;font-weight:800}
.gapline .amt{color:var(--pos-strong)} .gapline.neg .amt{color:var(--risk-strong)}
.gapline .arrow{font-size:.85em}
.gapmeter{min-width:150px}
.gm-track{position:relative;height:16px;border-radius:var(--r-pill);background:var(--wheat);overflow:hidden}
.gm-min{position:absolute;left:0;top:0;height:100%;background:color-mix(in oklab,var(--ink) 30%,var(--wheat))}
.gm-gap{position:absolute;top:0;height:100%;background:var(--pos-tint)}
.gm-appr{position:absolute;top:-2px;width:2px;height:20px;background:var(--ink);opacity:.4}
.gm-lab{display:flex;justify-content:space-between;gap:8px;font-size:var(--t-note);color:var(--muted);margin-top:5px}
.gm-lab .pos,.gm-gv{color:var(--pos-strong);font-weight:800}
.gm-na,.gm-na2{color:var(--muted-2);font-weight:700}

/* ---- #1 히어로 픽(그리드 깨기) ---- */
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:var(--sp-5);align-items:center;
  background:var(--surface);border:1px solid var(--hairline-strong);border-radius:var(--r-card);
  box-shadow:var(--shadow-sm);padding:var(--sp-5) var(--sp-6);margin-bottom:var(--sp-4);position:relative;overflow:hidden}
.hero::before{content:"오늘의 콕 집은 매물";position:absolute;top:12px;left:var(--sp-6);
  font-size:var(--t-note);font-weight:800;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--muted)}
.hero-score{text-align:center;padding-top:14px}
.hero-score .n{font-family:var(--font-serif);font-size:var(--t-score-hero);line-height:1;font-weight:700}
.hero-score .scorebar{margin:8px auto 0;width:80px}
.hero-mid{padding-top:14px}
.hero-mid .name{font-size:1.15rem;font-weight:800;letter-spacing:var(--ls-head)}
.hero-mid .addr{color:var(--muted);font-size:var(--t-data);margin-top:2px}
.hero-why{text-align:right;padding-top:14px;max-width:260px}
.hero-why .q{font-size:var(--t-data);color:var(--ink);line-height:1.5}
.hero-why .go{display:inline-block;margin-top:8px;font-weight:700;font-size:var(--t-data)}
@media(max-width:720px){.hero{grid-template-columns:1fr;text-align:left}
  .hero-why{text-align:left;max-width:none}.hero-score{text-align:left}}

/* ---- 랭킹 테이블(hairline only, sticky header) ---- */
.tablewrap{border:1px solid var(--hairline-strong);border-radius:var(--r-card);overflow:hidden;background:var(--surface)}
.scrollx{overflow-x:auto}
table.picks{border-collapse:collapse;width:100%;min-width:820px}
.picks th,.picks td{padding:0 var(--cell-px);height:var(--row-h);text-align:left;vertical-align:middle;
  border-bottom:1px solid var(--hairline)}
.picks thead th{position:sticky;top:0;background:var(--surface-2);z-index:1;height:38px;
  font-size:var(--t-label);text-transform:uppercase;letter-spacing:var(--ls-label);color:var(--muted);
  font-weight:700;border-bottom:2px solid var(--hairline-strong)}
.picks tbody tr:last-child td{border-bottom:none}
.picks tbody tr:hover{background:var(--surface-2)}
.picks tbody tr.hot td:first-child{box-shadow:inset 3px 0 0 var(--pos)}
.picks tbody tr.dim{color:var(--muted)}
.picks td.r,.picks th.r{text-align:right}
.picks td.num{font-variant-numeric:tabular-nums}
.picks .rank{color:var(--muted-2);font-size:var(--t-note);width:26px}
.picks .name{font-weight:700;color:var(--ink-strong)}
.picks .addr{color:var(--muted);font-size:var(--t-note);font-weight:400;margin-top:1px}
.picks .caseid{font-family:var(--font-mono);font-size:var(--t-note);color:var(--muted-2)}
.picks .scorecell{width:96px}
.money{font-weight:700}.money .u{color:var(--muted-2);font-weight:500;font-size:.85em;margin-left:1px}

/* ---- 필터 ---- */
.filters{display:flex;flex-wrap:wrap;gap:var(--sp-3);align-items:flex-end;margin:var(--sp-4) 0 var(--sp-5)}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:var(--t-label);color:var(--muted);
  font-weight:700;text-transform:uppercase;letter-spacing:var(--ls-label)}
.filters input,.filters select{font:inherit;font-size:var(--t-data);padding:8px 10px;border:1px solid var(--border-field);
  border-radius:var(--r-ctl);background:var(--surface);color:var(--ink)}
.filters input{width:96px}
.filters button{font:inherit;font-size:var(--t-data);font-weight:700;padding:9px 18px;border:none;
  border-radius:var(--r-ctl);background:var(--accent);color:#fff;cursor:pointer}
.filters button:hover{background:var(--accent-hover)}
.filters .reset{font-size:var(--t-note);color:var(--muted);padding:9px 4px}

/* ---- 카드/키밸류(상세) ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--sp-4);margin-top:var(--sp-4)}
.card{background:var(--surface);border:1px solid var(--hairline-strong);border-radius:var(--r-card);padding:var(--sp-5)}
.card h2{font-size:var(--t-label);text-transform:uppercase;letter-spacing:var(--ls-label);color:var(--muted);margin:0 0 var(--sp-3)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--hairline);font-size:var(--t-data)}
.kv:last-child{border-bottom:none}.kv .k{color:var(--muted)}
.kv .v{font-weight:700;font-variant-numeric:tabular-nums}

/* ---- 상태 박스(게이트/경고/안전) ---- */
.note-box{border-radius:var(--r-ctl);padding:11px 14px;font-size:var(--t-data);font-weight:600;margin-bottom:var(--sp-3);line-height:1.5}
.n-risk{background:var(--risk-tint);border:1px solid #f3b5ae;color:var(--risk-strong)}
.n-warn{background:var(--warn-tint);border:1px solid #ecc49a;color:var(--warn)}
.n-ok{background:var(--pos-tint);border:1px solid #aee0c7;color:var(--pos-strong)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:var(--t-note);font-weight:700;padding:3px 9px;border-radius:var(--r-pill);background:var(--surface-2);color:var(--muted)}
.tag.warn{background:var(--risk-tint);color:var(--risk-strong)}

/* ---- 방법론 ---- */
.formula{background:var(--surface);border:1px solid var(--hairline-strong);border-radius:var(--r-card);
  padding:16px 20px;font-family:var(--font-mono);font-size:var(--t-data);line-height:1.9}
.formula .w1{color:var(--pos-strong);font-weight:700}
.formula .w2{color:var(--accent);font-weight:700}
.formula .w3{color:var(--warn);font-weight:700}
table.params{border-collapse:collapse;width:100%;font-size:var(--t-data);background:var(--surface);
  border:1px solid var(--hairline-strong);border-radius:var(--r-card);overflow:hidden}
.params th,.params td{padding:10px 13px;border-bottom:1px solid var(--hairline);text-align:left}
.params tbody tr:last-child td{border-bottom:none}
.params thead th{background:var(--surface-2);font-size:var(--t-label);text-transform:uppercase;letter-spacing:var(--ls-label);color:var(--muted);border-bottom:2px solid var(--hairline-strong)}
.chips{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.chips .chip{background:var(--surface-2);border:1px solid var(--hairline-strong);border-radius:var(--r-ctl);padding:9px 14px;font-size:var(--t-data)}
.chips .chip b{color:var(--pos-strong);font-family:var(--font-mono)}

/* ---- 푸터 ---- */
.foot{margin-top:var(--sp-6);color:var(--muted);font-size:var(--t-note);line-height:1.7;
  border-top:1px solid var(--hairline);padding-top:var(--sp-4)}
.back{color:var(--muted);font-size:var(--t-data)}.back:hover{color:var(--accent)}
</style>
{% block head %}{% endblock %}
</head>
<body>
<header class="site">
  <div class="wrap">
    <span class="brand">차익 <b>큐레이션</b></span>
    <nav class="nav">
      <a href="/">매물</a>
      <a href="/methodology">방법론</a>
      {% if data_source is defined %}
        {% if data_source == 'db' %}<span class="src live">라이브 DB</span>
        {% else %}<span class="src sample">샘플 데이터</span>{% endif %}
      {% endif %}
    </nav>
  </div>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
</body>
</html>
